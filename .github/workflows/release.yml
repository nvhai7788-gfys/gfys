name: release

# 港丰影视直播工作台 —— 发布 release
#
# 复用 build-libobs-installers 工作流已编译成功的安装包 artifacts（三平台），
# 把它们发布为正式 GitHub release，无需重新编译。
#
# 手动触发（workflow_dispatch），或对 v* tag 的 push 自动触发。
# 版本号从 tag 名动态解析（v1.1.41 → 1.1.41），产物按 ref=当前 tag 定位（该 tag 指向的 build 成功产物）。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# 需要 contents: write 才能创建 release 并上传/删除资产
permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: 下载 macOS arm64 安装包
        uses: dawidd6/action-download-artifact@v27
        with:
          workflow: build.yml
          workflow_conclusion: success
          ref: ${{ github.ref_name }}
          name: mac-arm64
          path: dist
          if_no_artifact_found: warn

      - name: 下载 macOS x64 安装包
        uses: dawidd6/action-download-artifact@v27
        with:
          workflow: build.yml
          workflow_conclusion: success
          ref: ${{ github.ref_name }}
          name: mac-x64
          path: dist
          if_no_artifact_found: warn

      - name: 下载 Windows x64 安装包
        uses: dawidd6/action-download-artifact@v27
        with:
          workflow: build.yml
          workflow_conclusion: success
          ref: ${{ github.ref_name }}
          name: win-x64
          path: dist
          if_no_artifact_found: warn

      - name: 整理安装包为标准命名
        shell: bash
        run: |
          echo "== 下载到的原始文件 =="
          find dist -type f -printf '%s  %p\n' | sort -k2
          mkdir -p release
          V="${{ steps.ver.outputs.version }}"
          # 用数组收集候选文件，避免 pipefail + head 的 SIGPIPE 问题
          mapfile -t EXES < <(find dist -type f -name '*.exe' ! -name '*.blockmap' | sort)
          mapfile -t ZIPS < <(find dist -type f -name '*-win.zip' | sort)
          mapfile -t DMG_ARM < <(find dist -type f -name '*-arm64.dmg' ! -name '*.blockmap' | sort)
          mapfile -t DMG_X64 < <(find dist -type f -name '*.dmg' ! -name '*-arm64.dmg' ! -name '*.blockmap' | sort)
          echo "EXES=${#EXES[@]} ZIPS=${#ZIPS[@]} DMG_ARM=${#DMG_ARM[@]} DMG_X64=${#DMG_X64[@]}"
          # 用英文前缀（GitHub 会规范化中文资产名导致前缀丢失）
          if [ "${#EXES[@]}" -gt 0 ]; then cp "${EXES[0]}" "release/gangfeng-live-${V}-win.exe"; fi
          if [ "${#ZIPS[@]}" -gt 0 ]; then cp "${ZIPS[0]}" "release/gangfeng-live-${V}-win.zip"; fi
          if [ "${#DMG_ARM[@]}" -gt 0 ]; then cp "${DMG_ARM[0]}" "release/gangfeng-live-${V}-arm64.dmg"; fi
          if [ "${#DMG_X64[@]}" -gt 0 ]; then cp "${DMG_X64[0]}" "release/gangfeng-live-${V}-x64.dmg"; fi
          echo "== 整理后的标准文件 =="
          ls -lh release/

      - name: 删除旧 release 资产
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # 列出并删除该 tag 对应 release 上的所有旧资产，避免重复/乱码命名残留
          RELEASE_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          RELEASE_ID=$(echo "$RELEASE_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          if [ -z "$RELEASE_ID" ]; then
            echo "未找到现有 release，跳过删除"
          else
            echo "release id=$RELEASE_ID，删除其全部旧资产..."
            curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?per_page=100" \
              | python3 -c "import sys,json; [print(a['id'], a['name']) for a in json.load(sys.stdin)]" \
              | while read AID ANAME; do
                  echo "删除资产 [$AID] $ANAME"
                  curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                    "https://api.github.com/repos/${{ github.repository }}/releases/assets/$AID" \
                    -o /dev/null -w "  -> HTTP %{http_code}\n"
                done
          fi

      - name: 发布 release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: 港丰影视直播工作台 ${{ github.ref_name }}
          body: |
            港丰影视直播工作台 ${{ github.ref_name }} —— libobs 真引擎 + 三平台安装包

            腾讯云/阿里云直播管理工作台（Electron 33），本版本接入 libobs 真引擎（音频控制 / 源滤镜 / 场景过渡 / 实时预览回读），
            由 CI 从源码编译 obs-studio + obs-bridge 原生桥接，并打包三平台安装包。

            ## 安装包
            - Windows x64：NSIS 安装包（Setup）+ 免安装 ZIP
            - macOS arm64：DMG（Apple Silicon）
            - macOS x64：DMG（Intel，交叉编译）

            ## 说明
            - libobs 真引擎：渲染器可选「用 libobs 真引擎推流」，原生桥接不可用时自动回退 ffmpeg
            - 内置 ffmpeg：本地推流 / 录制免安装
            - 内置「关于与免责声明」与第三方开源引用来源（THIRD_PARTY_NOTICES.md）
            - 安装包未签名（identity: null），交付前如需请自行签名 / 公证

            ## 校验
            - static_check / test_ffmpeg_args / e2e_r76 / e2e_r77 / e2e_r75 / test_libobs_engine 全绿
          files: |
            release/*
          draft: false
          fail_on_unmatched_files: true
