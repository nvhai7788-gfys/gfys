name: build-libobs-installers

# 港丰影视直播工作台 —— libobs 真引擎 + 安装包 CI
#
# 产物（按平台/架构矩阵）：
#   macOS  arm64 → 港丰影视直播工作台-<ver>-arm64.dmg
#   macOS  x64   → 港丰影视直播工作台-<ver>.dmg
#   Windows x64  → 港丰影视直播工作台 Setup <ver>.exe + <ver>-win.zip
#
# 说明：
#   1) 本工作流在「联网 CI + Xcode/MSVC」环境把 libobs（obs-studio）与 obs-bridge 原生桥接
#      从源码编译并打包进安装包——这是本地沙箱（无 Xcode / 无 MSVC）做不到的「真引擎」环节。
#   2) libobs 用 obs-studio 30.2.3（按需调整 OBS_VER）；UI 关闭（ENABLE_UI=OFF），不引入 Qt。
#   3) 安装包未签名（identity:null），交付前如需可自行加签名/公证。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# 权限：build 只读仓库即可（不再回传日志，避免多 job 并发 push 冲突）
permissions:
  contents: read

env:
  OBS_VER: "30.2.3"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            target: mac
            eb_flags: "--mac dmg --arm64"
          # macos-13(Intel) runner 正被 GitHub 淘汰、排队严重，改用 macos-14(arm64) 交叉编译 x64
          # （obs-deps 是 universal 版，同时含 arm64 + x86_64，Xcode 支持 -arch x86_64 交叉编译）
          - os: macos-14
            arch: x64
            target: mac
            eb_flags: "--mac dmg --x64"
          # 注意：windows-latest 自 2026-06 起迁移到 VS2026（generator "Visual Studio 18 2026"），
          # 而 obs-studio 30.x 的预设仍是 VS2022，故钉死 windows-2022 保持 VS 17 2022。
          - os: windows-2022
            arch: x64
            target: win
            eb_flags: "--win nsis zip --x64"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Python 3.11（node-gyp 需要 distutils）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---------- 编译工具链 ----------
      - name: 安装 CMake / Ninja（macOS）
        if: matrix.target == 'mac'
        run: brew install cmake ninja

      - name: 安装 Ninja（Windows，CMake 已预装）
        if: matrix.target == 'win'
        run: choco install ninja -y

      # ---------- 安装依赖（提前：编译 addon 需要 node-gyp） ----------
      - name: 安装依赖
        run: npm ci || npm install

      # ---------- 编译 libobs + obs-bridge 原生桥接 ----------
      - name: 编译 libobs + obs-bridge（macOS）
        if: matrix.target == 'mac'
        run: |
          set -o pipefail
          bash scripts/build-native.sh 2>&1 | tee ci-last-build-mac.log
        env:
          ARCH: ${{ matrix.arch }}
          OBS_VER: ${{ env.OBS_VER }}

      - name: 编译 libobs + obs-bridge（Windows）
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $log = "ci-last-build-win.log"
          powershell -ExecutionPolicy Bypass -File scripts/build-native.ps1 *>&1 | Tee-Object $log
          $code = $LASTEXITCODE
          Write-Host "==> build-native 退出码: $code"
          if ($code -ne 0) {
            Write-Host "::error::build-native 失败 (exit $code)"
            Get-Content $log | Select-String -Pattern "error|Error|fatal|FATAL|not found|missing|Missing|Could NOT|失败|异常" | Select-Object -Last 40 | ForEach-Object { Write-Host "::error::$($_.Line)" }
            Get-Content $log -Tail 30 | ForEach-Object { Write-Host "::error::[tail] $_" }
            exit $code
          }
        env:
          OBS_VER: ${{ env.OBS_VER }}

      # ---------- 内置 ffmpeg（推流/录制依赖） ----------
      - name: 获取 ffmpeg（macOS）
        if: matrix.target == 'mac'
        run: |
          brew install ffmpeg
          bash scripts/fetch-ffmpeg.sh 2>&1 | tee -a ci-last-build-mac.log
        env:
          ARCH: ${{ matrix.arch }}

      - name: 获取 ffmpeg（Windows）
        if: matrix.target == 'win'
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh 2>&1 | tee -a ci-last-build-win.log

      # ---------- 打包安装包（含 libobs 原生桥接） ----------
      - name: 打包安装包
        shell: bash
        run: npx electron-builder --publish never --config build/electron-builder.ci.yml ${{ matrix.eb_flags }} 2>&1 | tee -a ci-last-build-${{ matrix.target }}.log
        env:
          # 不打签名：identity 已在配置中置 null
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # 关键：--publish never 显式禁止发布。electron-builder 在 tag 触发（getCiTag 命中 v*）
          # 时若 publish 未显式设置，会自动进入 onTag 发布模式，并读取 GITHUB_TOKEN（GitHub
          # 自动注入到每个 step、即使未显式设 GH_TOKEN）尝试创建 release —— 但本 job 权限是
          # contents: read → 403「Resource not accessible by integration」，导致打包步骤 exit 1。
          # 发布 release 由独立的 release.yml（workflow_run 触发，contents: write）负责。

      # ---------- 上传产物 ----------
      - name: 上传产物（macOS）
        if: matrix.target == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
          retention-days: 30

      - name: 上传产物（Windows）
        if: matrix.target == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 30
